[project]
name = "log-triage"
version = "0.2.0"
description = "An MCP server for investigating logs."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp==4.0.3",
]

[project.scripts]
log-triage = "logtriage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logtriage"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
